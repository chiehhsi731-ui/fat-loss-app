<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>減脂挑戰</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0812;color:#fff;font-family:-apple-system,sans-serif;max-width:390px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden}

/* 背景動態光暈 */
.bg-orbs{position:fixed;top:0;left:50%;transform:translateX(-50%);width:390px;height:100vh;pointer-events:none;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:0.18;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
.orb-1{width:280px;height:280px;background:radial-gradient(circle,#4B6FDD,transparent);top:-60px;left:-60px;animation:float1 8s infinite alternate}
.orb-2{width:220px;height:220px;background:radial-gradient(circle,#9B59DD,transparent);top:30%;right:-80px;animation:float2 11s infinite alternate}
.orb-3{width:200px;height:200px;background:radial-gradient(circle,#3B8FCC,transparent);top:55%;left:-50px;animation:float3 9s infinite alternate}
.orb-4{width:180px;height:180px;background:radial-gradient(circle,#7B4FBB,transparent);bottom:15%;right:-40px;animation:float4 13s infinite alternate}
@keyframes float1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(40px,60px) scale(1.15)}}
@keyframes float2{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-50px,40px) scale(1.1)}}
@keyframes float3{0%{transform:translate(0,0) scale(1)}100%{transform:translate(50px,-50px) scale(1.2)}}
@keyframes float4{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-40px,-60px) scale(1.1)}}
.header{background:rgba(10,8,18,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:14px 20px 10px;border-bottom:1px solid rgba(255,255,255,0.06);position:sticky;top:0;z-index:10}
.header-top{display:flex;justify-content:space-between;align-items:center}
.app-title{font-size:19px;font-weight:600}
.streak-badge{background:#7F77DD;color:#fff;font-size:15px;padding:3px 10px;border-radius:20px}
.header-sub{color:#6b6485;font-size:16px;margin-top:2px}
.screen{padding:16px;display:none}
.screen.active{display:block}
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:390px;background:rgba(13,10,24,0.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,0.06);display:flex;padding:8px 0 20px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;background:none;padding:4px 0}
.tab span{font-size:12px;color:#6b6485}
.tab.active span{color:#7F77DD}
.tab svg{width:22px;height:22px;fill:none;stroke:#6b6485;stroke-width:1.5}
.tab.active svg{stroke:#7F77DD}
.card{background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:24px;border:1px solid rgba(255,255,255,0.1);padding:20px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.1)}
.card-chart{background:linear-gradient(135deg,rgba(20,40,80,0.8) 0%,rgba(10,15,40,0.9) 100%);box-shadow:0 8px 32px rgba(30,60,150,0.25),inset 0 1px 0 rgba(255,255,255,0.1)}
.card-goal{background:linear-gradient(135deg,rgba(30,15,60,0.8) 0%,rgba(15,10,35,0.9) 100%);box-shadow:0 8px 32px rgba(120,60,200,0.2),inset 0 1px 0 rgba(255,255,255,0.1)}
.card-badge{background:linear-gradient(135deg,rgba(10,35,35,0.8) 0%,rgba(5,20,30,0.9) 100%);box-shadow:0 8px 32px rgba(30,150,130,0.2),inset 0 1px 0 rgba(255,255,255,0.1)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent)}
.section-label{color:rgba(255,255,255,0.45);font-size:12px;font-weight:600;letter-spacing:1.2px;margin-bottom:12px;text-transform:uppercase}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat-box{border-radius:24px;padding:20px;border:1px solid rgba(255,255,255,0.15);position:relative;overflow:hidden;min-height:140px;display:flex;flex-direction:column;justify-content:flex-end}
.stat-box::after{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,0.12) 0%,transparent 100%);border-radius:24px 24px 0 0;pointer-events:none}
.stat-box.weight-box{background:linear-gradient(135deg,#2d6be4 0%,#1a3a8f 40%,#0d1f5c 100%);box-shadow:0 8px 32px rgba(45,107,228,0.4),inset 0 1px 0 rgba(255,255,255,0.2)}
.stat-box.fat-box{background:linear-gradient(135deg,#a855f7 0%,#7c3aed 40%,#4c1d95 100%);box-shadow:0 8px 32px rgba(168,85,247,0.4),inset 0 1px 0 rgba(255,255,255,0.2)}
.stat-val{color:#fff;font-size:32px;font-weight:700;position:relative;z-index:1}
.stat-unit{color:rgba(255,255,255,0.5);font-size:14px;font-weight:400}
.stat-label{color:rgba(255,255,255,0.5);font-size:13px;margin-top:4px;position:relative;z-index:1}
.stat-delta{font-size:13px;margin-top:2px;color:#4ecfa0;position:relative;z-index:1}
.week-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(127,119,221,0.15);border:1px solid rgba(127,119,221,0.3);border-radius:20px;padding:4px 12px;font-size:14px;color:rgba(255,255,255,0.5);margin-bottom:14px}
.week-pill strong{color:#AFA9EC}
.progress-wrap{margin-top:6px}
.progress-label{display:flex;justify-content:space-between;margin-bottom:6px}
.progress-label span{font-size:13px;color:rgba(255,255,255,0.45)}
.progress-label strong{font-size:13px;color:#AFA9EC}
.progress-bar{background:rgba(255,255,255,0.08);border-radius:20px;height:6px}
.progress-fill{background:linear-gradient(90deg,#7F77DD,#AFA9EC);border-radius:20px;height:6px;transition:width .5s}
.badge-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.badge{background:rgba(83,74,183,0.2);color:#AFA9EC;font-size:13px;padding:4px 10px;border-radius:20px;border:1px solid rgba(127,119,221,0.25)}
.badge.earned{background:rgba(83,74,183,0.5);color:#fff;border-color:#7F77DD}
.member-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #2a2040}
.member-row:last-child{border-bottom:none}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;flex-shrink:0;background:#3C3489;color:#AFA9EC}
.member-info{flex:1}
.member-name{color:#fff;font-size:15px;font-weight:500}
.member-stats{color:#6b6485;font-size:15px;margin-top:1px}
.meal-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #2a2040}
.meal-row:last-child{border-bottom:none}
.meal-name{color:#ccc;font-size:15px}
.meal-type{color:#6b6485;font-size:15px}
.meal-cal{color:#7F77DD;font-size:15px;font-weight:600}
.goal-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #2a2040}
.goal-row:last-child{border-bottom:none}
.goal-label{color:#888;font-size:15px}
.goal-val{color:#fff;font-size:15px;font-weight:500}
.btn-purple{position:relative;overflow:hidden;background:linear-gradient(180deg,#6B63E0 0%,#4A42C0 100%);color:#fff;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:600;width:100%;cursor:pointer;margin-top:10px;box-shadow:0 4px 20px rgba(80,70,200,0.5),inset 0 1px 0 rgba(255,255,255,0.15);letter-spacing:0.3px}
.btn-purple::after{content:'';position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);width:60%;height:36px;background:radial-gradient(ellipse,rgba(255,255,255,0.3) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.btn-purple:active{transform:translateY(1px);box-shadow:0 2px 10px rgba(80,70,200,0.4)}
.btn-outline{position:relative;overflow:hidden;background:rgba(255,255,255,0.05);color:#AFA9EC;border:1px solid rgba(127,119,221,0.3);border-radius:14px;padding:13px;font-size:15px;width:100%;cursor:pointer;margin-top:10px;letter-spacing:0.3px}
.btn-outline::after{content:'';position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);width:60%;height:36px;background:radial-gradient(ellipse,rgba(175,169,236,0.3) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.btn-outline:active{background:rgba(255,255,255,0.08)}
.input-field{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 14px;color:#fff;font-size:15px;width:100%;outline:none;margin-bottom:10px}
.input-field:focus{border-color:rgba(127,119,221,0.6);background:rgba(255,255,255,0.09)}
.member-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.06)}
.member-row:last-child{border-bottom:none}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;flex-shrink:0;background:linear-gradient(135deg,#534AB7,#3C3489);color:#fff}
.goal-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.06)}
.goal-row:last-child{border-bottom:none}
.goal-label{color:rgba(255,255,255,0.5);font-size:15px}
.meal-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.06)}
.meal-row:last-child{border-bottom:none}
.meal-cal{color:#AFA9EC;font-size:14px;font-weight:600}
#food-results div:hover{background:rgba(100,120,200,0.15)!important;border-color:rgba(127,119,221,0.4)!important}
#gram-row .input-field{margin-bottom:0}
.loading{display:flex;align-items:center;justify-content:center;height:200px;color:rgba(255,255,255,0.3)}
.member-name{color:#fff;font-size:15px;font-weight:500}
.member-stats{color:rgba(255,255,255,0.4);font-size:13px;margin-top:2px}
.meal-name{color:rgba(255,255,255,0.85);font-size:14px}
.meal-type{color:rgba(255,255,255,0.35);font-size:13px}
pb{display:block;height:120px}

/* Hero Banner */
.hero-banner{position:relative;width:100%;height:160px;overflow:hidden;margin-bottom:0}
.hero-bg{position:absolute;inset:0;background:linear-gradient(135deg,#0d0820 0%,#1a1040 40%,#0d0820 100%)}
.hero-bg::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(100,120,220,0.25) 0%,transparent 60%),radial-gradient(ellipse at 75% 40%,rgba(180,100,220,0.2) 0%,transparent 55%)}
.hero-content{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.hero-uccu{
  font-size:72px;font-weight:900;letter-spacing:4px;line-height:1;
  background:linear-gradient(180deg,#ffb8d4 0%,#ff6fa8 40%,#e8408a 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 2px 8px rgba(255,100,160,0.5));
  text-shadow:none;
  font-family:-apple-system,sans-serif;
  animation:heroPulse 4s ease-in-out infinite alternate
}
@keyframes heroPulse{
  0%{filter:drop-shadow(0 2px 8px rgba(255,100,160,0.4)) drop-shadow(0 0 20px rgba(255,100,160,0.2))}
  100%{filter:drop-shadow(0 2px 16px rgba(255,100,160,0.7)) drop-shadow(0 0 40px rgba(255,100,160,0.35))}
}
.hero-tagline{font-size:13px;color:rgba(255,255,255,0.45);letter-spacing:1.5px;font-weight:400}

/* ══════════════════════════════════════
   動態系統
══════════════════════════════════════ */

/* keyframes */
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{transform:scale(.82);opacity:0}65%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes rowSlideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes rowSlideOut{from{opacity:1;transform:translateX(0);max-height:64px}to{opacity:0;transform:translateX(24px);max-height:0;padding:0;margin:0}}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes badgePop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
@keyframes teamCardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes formExpand{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@keyframes btnSuccess{0%{transform:scale(1)}40%{transform:scale(.95)}70%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes tabJump{0%{transform:translateY(0)}40%{transform:translateY(-6px)}70%{transform:translateY(2px)}100%{transform:translateY(0)}}
@keyframes toastIn{from{opacity:0;transform:translateY(70px) translateX(-50%)}to{opacity:1;transform:translateY(0) translateX(-50%)}}
@keyframes toastOut{from{opacity:1;transform:translateY(0) translateX(-50%)}to{opacity:0;transform:translateY(70px) translateX(-50%)}}

/* 進場 class */
.anim-card{opacity:0;animation:fadeSlideUp .45s cubic-bezier(.2,0,.2,1) forwards}
.anim-stat{opacity:0;animation:popIn .4s cubic-bezier(.175,.885,.32,1.275) forwards}
.anim-row{animation:rowSlideIn .28s cubic-bezier(.2,0,.2,1) forwards}
.anim-out{animation:rowSlideOut .28s cubic-bezier(.4,0,1,1) forwards;overflow:hidden}
.team-card-anim{opacity:0;animation:teamCardIn .4s cubic-bezier(.2,0,.2,1) forwards}
.form-expand{animation:formExpand .25s cubic-bezier(.2,0,.2,1) forwards}
.btn-did-success{animation:btnSuccess .35s cubic-bezier(.175,.885,.32,1.275)}

/* tab 過場 */
.screen{opacity:1;transition:opacity .2s ease}
.screen.fading{opacity:0;pointer-events:none}

/* tab active 跳動 */
.tab.active svg,.tab.active span{animation:tabJump .3s cubic-bezier(.175,.885,.32,1.275)}

/* 按鈕 hover/press */
.btn-purple{transition:transform .15s cubic-bezier(.175,.885,.32,1.275),box-shadow .15s ease}
.btn-purple:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(80,70,200,.6),inset 0 1px 0 rgba(255,255,255,.15)}
.btn-purple:active{transform:scale(.96) translateY(0)!important;box-shadow:0 2px 10px rgba(80,70,200,.4)}
.btn-outline{transition:transform .15s cubic-bezier(.175,.885,.32,1.275),background .15s ease,border-color .15s ease}
.btn-outline:hover{transform:translateY(-2px);background:rgba(255,255,255,.08);border-color:rgba(127,119,221,.5)}
.btn-outline:active{transform:scale(.96)}

/* card / stat-box hover */
.card{transition:transform .2s cubic-bezier(.2,0,.2,1),box-shadow .2s ease}
.card:hover{transform:translateY(-2px)}
.stat-box{transition:transform .2s cubic-bezier(.175,.885,.32,1.275)}
.stat-box:hover{transform:scale(1.02)}

/* tab press */
.tab{transition:transform .15s ease}
.tab:active{transform:scale(.88)}

/* 進度條 */
.progress-fill{transition:width 1s cubic-bezier(.2,0,.2,1)!important}

/* gram-row 展開 */
#gram-row.visible{animation:slideDown .22s cubic-bezier(.2,0,.2,1) forwards}

/* streak badge pop */
.streak-badge.loaded{animation:badgePop .4s cubic-bezier(.175,.885,.32,1.275) forwards}

/* food 搜尋結果 */
#food-results > div{transition:background .15s ease,border-color .15s ease;animation:rowSlideIn .2s cubic-bezier(.2,0,.2,1) both}

/* goal-row hover */
.goal-row{transition:background .15s ease}
.goal-row:hover{background:rgba(255,255,255,.03);border-radius:8px}

/* Toast */
#toast-container{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:999;pointer-events:none;width:calc(100% - 40px);max-width:350px}
.toast-msg{background:rgba(28,20,48,.96);backdrop-filter:blur(16px);border:1px solid rgba(127,119,221,.3);color:#fff;border-radius:16px;padding:14px 18px;font-size:14px;display:flex;align-items:center;gap:10px;margin-top:8px;animation:toastIn .35s cubic-bezier(.2,0,.2,1) forwards}
.toast-msg.out{animation:toastOut .3s cubic-bezier(.4,0,1,1) forwards}
.toast-icon{font-size:18px;flex-shrink:0}
</style>
</head>
<body>
<div id="toast-container"></div>
<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
</div>
<div style="position:relative;z-index:1">

<div class="header">
  <div class="header-top">
    <span class="app-title">減脂挑戰</span>
    <span class="streak-badge" id="streak-badge">🔥 載入中</span>
  </div>
  <div class="header-sub" id="header-sub">正在載入...</div>
</div>

<!-- Hero Banner -->
<div class="hero-banner">
  <div class="hero-bg"></div>
  <div class="hero-content">
    <div class="hero-uccu">UCCU</div>
    <div class="hero-tagline">減脂挑戰，從今天開始 💪</div>
  </div>
</div>

<!-- 數據頁 -->
<div class="screen active" id="screen-data">
  <div class="week-pill">本週 <strong id="week-rate">計算中...</strong></div>
  <div class="stat-row">
    <div class="stat-box weight-box anim-stat" style="animation-delay:.05s">
      <div class="stat-val" id="cur-weight">--<span class="stat-unit">kg</span></div>
      <div class="stat-label">今日體重</div>
      <div class="stat-delta" id="weight-delta"></div>
    </div>
    <div class="stat-box fat-box anim-stat" style="animation-delay:.13s">
      <div class="stat-val" id="cur-fat">--<span class="stat-unit">%</span></div>
      <div class="stat-label">體脂率</div>
      <div class="stat-delta" id="fat-delta"></div>
    </div>
  </div>
  <div class="card card-chart anim-card" style="animation-delay:.2s;background:linear-gradient(135deg,rgba(20,40,80,0.8) 0%,rgba(10,15,40,0.9) 100%)">
    <div class="section-label">本週體重趨勢</div>
    <div id="weight-chart" style="min-height:80px;display:flex;align-items:center;justify-content:center;color:#6b6485;font-size:16px">記錄2天以上才會顯示圖表</div>
  </div>
  <div class="card card-goal anim-card" style="animation-delay:.28s">
    <div class="section-label">目標進度</div>
    <div class="progress-wrap">
      <div class="progress-label"><span id="goal-w-label">目標體重</span><strong id="goal-w-val">--</strong></div>
      <div class="progress-bar"><div class="progress-fill" id="goal-w-bar" style="width:0%"></div></div>
    </div>
    <div class="progress-wrap" style="margin-top:10px">
      <div class="progress-label"><span id="goal-f-label">目標體脂</span><strong id="goal-f-val">--</strong></div>
      <div class="progress-bar"><div class="progress-fill" id="goal-f-bar" style="width:0%"></div></div>
    </div>
  </div>
  <div class="card card-badge anim-card" style="animation-delay:.36s">
    <div class="section-label">成就徽章</div>
    <div class="badge-row" id="badge-row">
      <span class="badge">🏅 載入中</span>
    </div>
  </div>
  <pb></pb>
</div>

<!-- 隊伍頁 -->
<div class="screen" id="screen-team">
  <div id="team-content"><div class="loading">載入隊伍資料...</div></div>
  <button class="btn-purple" onclick="showCreateTeam()">＋ 建立新隊伍</button>
  <button class="btn-outline" onclick="showJoinTeam()">🔗 輸入邀請碼加入</button>
  <div id="join-team-form" style="display:none;margin-top:12px">
    <div class="card card-goal">
      <div class="section-label">加入隊伍</div>
      <input class="input-field" id="invite-code" placeholder="輸入邀請碼（8碼）" maxlength="8">
      <button class="btn-purple" onclick="joinTeam()">加入隊伍</button>
    </div>
  </div>
  <div id="create-team-form" style="display:none;margin-top:12px">
    <div class="card card-goal">
      <div class="section-label">建立隊伍</div>
      <input class="input-field" id="team-name" placeholder="隊伍名稱">
      <input class="input-field" id="team-deadline" type="date" placeholder="截止日">
      <input class="input-field" id="bet-content" placeholder="賭注內容（輸家要做什麼）">
      <input class="input-field" id="bet-amount" type="number" placeholder="賭注金額（選填）">
      <button class="btn-purple" onclick="createTeam()">建立隊伍</button>
    </div>
  </div>
  <pb></pb>
</div>

<!-- 飲食頁 -->
<div class="screen" id="screen-food">
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">

/* ── Toast（取代 alert）── */
function showToast(msg, type='success'){
  const icons={success:'✅',error:'❌',info:'💡',warn:'⚠️'};
  const c=document.getElementById('toast-container');
  const el=document.createElement('div');
  el.className='toast-msg';
  el.innerHTML=`<span class="toast-icon">${icons[type]||'✅'}</span><span>${msg}</span>`;
  c.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),320);},3200);
}

/* ── 數字滾動 ── */
function animateValue(el,from,to,dur=800,suffix=''){
  if(!el)return;
  const isFloat=!Number.isInteger(to);
  const start=performance.now();
  const tick=(now)=>{
    const t=Math.min((now-start)/dur,1);
    const e=1-Math.pow(1-t,3);
    const v=from+(to-from)*e;
    el.textContent=(isFloat?v.toFixed(1):Math.round(v))+suffix;
    if(t<1)requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

async function loadData() {
  const weekAgo = new Date(Date.now() - 7*24*60*60*1000).toISOString();
  const { data } = await db.from('body_records').select('*').eq('user_id', userId).gte('recorded_at', weekAgo).order('recorded_at', {ascending:false});
  if (!data || data.length === 0) { document.getElementById('streak-badge').textContent = '🔥 0天'; return; }
  const latest = data[0];
  if (latest.weight) {
    const wEl=document.getElementById('cur-weight');
    wEl.innerHTML=`<span id="w-num">0</span><span class="stat-unit">kg</span>`;
    setTimeout(()=>animateValue(document.getElementById('w-num'),0,latest.weight,700),300);
  }
  if (latest.body_fat) {
    const fEl=document.getElementById('cur-fat');
    fEl.innerHTML=`<span id="f-num">0</span><span class="stat-unit">%</span>`;
    setTimeout(()=>animateValue(document.getElementById('f-num'),0,latest.body_fat,700),420);
  }
  document.getElementById('week-rate').textContent = `${data.length}/7天`;
  // 畫體重趨勢圖
  const chartEl = document.getElementById('weight-chart');
  if (chartEl && data.length > 1) {
    const weights = data.filter(d => d.weight).reverse();
    if (weights.length > 1) {
      const min = Math.min(...weights.map(d => d.weight)) - 0.5;
      const max = Math.max(...weights.map(d => d.weight)) + 0.5;
      const w = chartEl.offsetWidth || 320, h = 110;
      const pad = { l: 10, r: 10, t: 20, b: 24 };
      const pts = weights.map((d, i) => ({
        x: pad.l + (i / (weights.length - 1)) * (w - pad.l - pad.r),
        y: pad.t + (1 - (d.weight - min) / (max - min)) * (h - pad.t - pad.b),
        w: d.weight,
        date: new Date(d.recorded_at).toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric' })
      }));
      // 產生平滑曲線路徑
      const smooth = pts.map((p, i, a) => {
        if (i === 0) return `M${p.x},${p.y}`;
        const prev = a[i - 1];
        const cx = (prev.x + p.x) / 2;
        return `C${cx},${prev.y} ${cx},${p.y} ${p.x},${p.y}`;
      }).join(' ');
      const areaPath = smooth + ` L${pts[pts.length-1].x},${h} L${pts[0].x},${h} Z`;
      chartEl.style.minHeight = h + 'px';
      chartEl.innerHTML = `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="overflow:visible">
        <defs>
          <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#6478C8"/>
            <stop offset="100%" stop-color="#AFA9EC"/>
          </linearGradient>
          <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7F77DD" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#7F77DD" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="${areaPath}" fill="url(#areaGrad)"/>
        <path d="${smooth}" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round"/>
        ${pts.map((p, i) => `
          <circle cx="${p.x}" cy="${p.y}" r="4" fill="#0a0812" stroke="#AFA9EC" stroke-width="2"/>
          <text x="${p.x}" y="${p.y - 9}" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)" font-weight="600">${p.w}</text>
          <text x="${p.x}" y="${h - 4}" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.3)">${p.date}</text>
        `).join('')}
      </svg>`;}
  }
  const { data: members } = await db.from('team_members').select('streak,goal_weight,goal_body_fat').eq('user_id', userId).order('joined_at', { ascending: false });
  // 取有目標設定的那筆
  const member = members?.find(m => m.goal_weight || m.goal_body_fat) || members?.[0];
  if (member) {
    const badge=document.getElementById('streak-badge');
    badge.textContent=`🔥 ${member.streak || 0}天`;
    badge.classList.remove('loaded');
    requestAnimationFrame(()=>badge.classList.add('loaded'));
    if (member.goal_weight && latest.weight) {
      document.getElementById('goal-w-label').textContent = `目標體重 ${member.goal_weight}kg`;
      document.getElementById('goal-w-val').textContent = `${latest.weight}kg`;
      // 進度條：假設起點比目標重10kg，計算已完成%
      const startW = Math.max(latest.weight, member.goal_weight + 10);
      const wPct = Math.max(0, Math.min(100, Math.round((startW - latest.weight) / (startW - member.goal_weight) * 100)));
      document.getElementById('goal-w-bar').style.width='0%';
      setTimeout(()=>{document.getElementById('goal-w-bar').style.width=wPct+'%';},420);
      document.getElementById('goal-w-val').textContent = `${latest.weight}kg → 目標${member.goal_weight}kg`;
    }
    if (member.goal_body_fat && latest.body_fat) {
      document.getElementById('goal-f-label').textContent = `目標體脂 ${member.goal_body_fat}%`;
      document.getElementById('goal-f-val').textContent = `${latest.body_fat}% → 目標${member.goal_body_fat}%`;
      const startF = Math.max(latest.body_fat, member.goal_body_fat + 10);
      const fPct = Math.max(0, Math.min(100, Math.round((startF - latest.body_fat) / (startF - member.goal_body_fat) * 100)));
      document.getElementById('goal-f-bar').style.width='0%';
      setTimeout(()=>{document.getElementById('goal-f-bar').style.width=fPct+'%';},540);
    }
  }
  const { data: badges } = await db.from('achievements').select('badge_type').eq('user_id', userId);
  const badgeNames = { first_record:'🏅 首次記錄', streak_7:'🔥 7天連續', goal_achieved:'🏆 目標達成' };
  const badgeEl = document.getElementById('badge-row');
  if (badges && badges.length > 0) {
    badgeEl.innerHTML = badges.map(b => `<span class="badge earned">${badgeNames[b.badge_type] || b.badge_type}</span>`).join('');
  } else {
    badgeEl.innerHTML = '<span class="badge">完成記錄解鎖徽章！</span>';
  }
}

  if (navigator.clipboard) {
    navigator.clipboard.writeText(msg).then(() => showToast('邀請訊息已複製！直接貼給朋友'));
  } else {
    // fallback
    const el = document.createElement('textarea');
    el.value = msg;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    showToast('邀請訊息已複製！直接貼給朋友');
  }
}

async function deleteMeal(id,btn){
  const row=btn?btn.closest('.meal-row'):null;
  if(row){row.classList.add('anim-out');await new Promise(r=>setTimeout(r,260));}
  await db.from('meal_records').delete().eq('id', id);
  loadMeals();
  const today = new Date().toISOString().split('T')[0];
  const { data } = await db.from('meal_records').select('calories, protein').eq('user_id', userId).gte('recorded_at', `${today}T00:00:00`);
  const total = data ? data.reduce((s, r) => s + r.calories, 0) : 0;
  const totalProtein = data ? data.reduce((s, r) => s + (r.protein || 0), 0) : 0;
  document.getElementById('today-cal').textContent = total + ' kcal';
  document.getElementById('today-protein').textContent = totalProtein.toFixed(1) + 'g';
}

async function loadMeals() {
  const today = new Date().toISOString().split('T')[0];
  const { data } = await db.from('meal_records').select('*').eq('user_id', userId).gte('recorded_at', `${today}T00:00:00`).order('recorded_at');
  const total = data ? data.reduce((s,r) => s + (r.calories||0), 0) : 0;
  const totalProtein = data ? data.reduce((s,r) => s + (r.protein||0), 0) : 0;
  animateValue(document.getElementById('today-cal'),0,total,600,' kcal');
  animateValue(document.getElementById('today-protein'),0,totalProtein,600,'g');
  const el = document.getElementById('meal-list');
  if (!data || data.length === 0) { el.innerHTML = '<div style="color:#6b6485;font-size:15px;padding:8px 0">今天還沒有飲食記錄</div>'; return; }
  el.innerHTML = data.map((r,idx) => `<div class="meal-row anim-row" style="animation-delay:${idx*50}ms">
    <div style="flex:1;min-width:0">
      <div class="meal-name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.food_name}</div>
      <div class="meal-type">${r.meal_type}</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
      <div class="meal-cal">${r.calories} kcal</div>
      <button onclick="deleteMeal('${r.id}',this)" style="background:none;border:none;color:#6b6485;font-size:18px;cursor:pointer;padding:0 4px;line-height:1;transition:color .15s" onmouseover="this.style.color='#ff6b6b'" onmouseout="this.style.color='#6b6485'">×</button>
    </div>
  </div>`).join('');
}

async function addMeal() {
  const mealType = document.getElementById('meal-type').value;
  const foodName = document.getElementById('food-search').value.trim();
  const calories = parseInt(document.getElementById('food-cal').value);
  if (!foodName) { showToast('請輸入食物名稱','error'); return; }
  if (!calories || calories <= 0) { showToast('請輸入卡路里（搜尋食物後輸入克數可自動計算）','error'); return; }
  const addBtn=document.querySelector('#screen-food .btn-purple');
  if(addBtn){addBtn.textContent='記錄中...';addBtn.disabled=true;}
  await db.from('meal_records').insert({ user_id: userId, meal_type: mealType, food_name: foodName, calories });
  document.getElementById('food-search').value = '';
  document.getElementById('food-cal').value = '';
  document.getElementById('food-grams').value = '';
  document.getElementById('gram-row').style.display = 'none';
  document.getElementById('food-results').innerHTML = '';
  selectedCalPer100g = 0;
  if(addBtn){
    addBtn.textContent='✓ 已記錄';addBtn.classList.add('btn-did-success');
    setTimeout(()=>{addBtn.textContent='新增記錄';addBtn.disabled=false;addBtn.classList.remove('btn-did-success');},1200);
  }
  showToast(`${mealType} ${foodName} ${calories} kcal 已記錄！`);
  loadMeals();
}

let selectedCalPer100g = 0;

async function searchFood() {
  const q = document.getElementById('food-search').value.trim();
  const gramRow = document.getElementById('gram-row');
  if (q.length < 1) {
    document.getElementById('food-results').innerHTML = '';
    gramRow.style.display = 'none';
    selectedCalPer100g = 0;
    return;
  }
  const { data } = await db.from('food_database').select('*').ilike('name', `%${q}%`).limit(8);
  const el = document.getElementById('food-results');
  if (!data || data.length === 0) {
    el.innerHTML = '<div style="color:#6b6485;font-size:16px;padding:6px 0">找不到食物，可直接輸入卡路里</div>';
    return;
  }
  el.innerHTML = data.map((f, i) =>
    `<div id="food-opt-${i}" onclick="selectFood(${i},'${f.name.replace(/'/g,"\\'")}',${f.calories_per_100g})"
      style="padding:10px 12px;background:#13101f;border-radius:10px;margin-bottom:5px;cursor:pointer;font-size:15px;color:#ccc;display:flex;justify-content:space-between;align-items:center;border:1px solid #2a2040;animation-delay:${i*40}ms">
      <span>${f.name}</span>
      <span style="color:#7F77DD;font-size:16px;white-space:nowrap">${f.calories_per_100g} kcal/100g</span>
    </div>`
  ).join('');
}

function selectFood(idx, name, calPer100g) {
  document.getElementById('food-search').value = name;
  document.getElementById('food-results').innerHTML = '';
  selectedCalPer100g = calPer100g;
  document.getElementById('cal-per-100g').textContent = calPer100g;
  document.getElementById('food-grams').value = '';
  document.getElementById('food-cal').value = '';
  const gramRow = document.getElementById('gram-row');
  gramRow.style.display='flex';
  gramRow.classList.remove('visible');
  requestAnimationFrame(()=>gramRow.classList.add('visible'));
  document.getElementById('food-grams').focus();
}

function calcCalFromGrams() {
  const grams = parseFloat(document.getElementById('food-grams').value);
  if (!isNaN(grams) && selectedCalPer100g > 0) {
    document.getElementById('food-cal').value = Math.round(grams * selectedCalPer100g / 100);
  }
}

async function loadTeams() {
  const { data: members } = await db.from('team_members').select('team_id, goal_weight, goal_body_fat, streak').eq('user_id', userId);
  const el = document.getElementById('team-content');
  if (!members || members.length === 0) { el.innerHTML = '<div style="color:#6b6485;font-size:15px;padding:8px 0;margin-bottom:12px">還沒有加入任何隊伍</div>'; return; }
  const teamIds = members.map(m => m.team_id).filter(id => id !== null && id !== undefined);
  if (teamIds.length === 0) { el.innerHTML = '<div style="color:#6b6485;font-size:15px;padding:8px 0;margin-bottom:12px">還沒有加入任何隊伍</div>'; return; }
  const { data: teams } = await db.from('teams').select('*').in('id', teamIds);
  if (!teams || teams.length === 0) { el.innerHTML = '<div style="color:#6b6485;font-size:15px;padding:8px 0;margin-bottom:12px">還沒有加入任何隊伍</div>'; return; }
  // 查每個隊伍的成員和最新體重
  const memberDataMap = {};
  for (const t of teams) {
    const { data: mems } = await db.from('team_members').select('user_id, streak').eq('team_id', t.id);
    const userIds = (mems || []).map(m => m.user_id);
    const { data: uinfos } = await db.from('users').select('id, display_name').in('id', userIds.length > 0 ? userIds : ['none']);
    const weekAgo = new Date(Date.now() - 7*24*60*60*1000).toISOString();
    const { data: bodyRecs } = await db.from('body_records').select('user_id, weight, body_fat').in('user_id', userIds.length > 0 ? userIds : ['none']).gte('recorded_at', weekAgo).order('recorded_at', { ascending: false });
    const latestBody = {};
    for (const r of (bodyRecs || [])) { if (!latestBody[r.user_id]) latestBody[r.user_id] = r; }
    const nameMap = {};
    for (const u of (uinfos || [])) nameMap[u.id] = u.display_name || '隊友';
    memberDataMap[t.id] = { mems: mems || [], nameMap, latestBody };
  }

  el.innerHTML = teams.map((t,tIdx) => {
    const { mems, nameMap, latestBody } = memberDataMap[t.id] || { mems: [], nameMap: {}, latestBody: {} };
    const sorted = [...mems].sort((a, b) => (b.streak || 0) - (a.streak || 0));
    const memberRows = sorted.map((m, i) => {
      const name = nameMap[m.user_id] || '隊友';
      const body = latestBody[m.user_id];
      const isMe = m.user_id === userId ? ' (我)' : '';
      const medals = ['🥇','🥈','🥉'];
      return `<div class="anim-row" style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1e1940;font-size:16px;animation-delay:${(tIdx*3+i)*40+120}ms">
        <span style="color:#ccc">${medals[i]||'  '} ${name}${isMe}</span>
        <span style="color:#7F77DD">🔥${m.streak||0}天 ${body?.weight ? body.weight+'kg' : ''} ${body?.body_fat ? body.body_fat+'%' : ''}</span>
      </div>`;
    }).join('');
    return `<div class="card team-card-anim" style="margin-bottom:12px;animation-delay:${tIdx*80}ms">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-size:15px;font-weight:600;color:#fff">${t.name}</div>
        <div style="font-size:15px;color:#6b6485">截止 ${t.deadline || '--'}</div>
      </div>
      ${t.bet_content ? `<div style="color:#AFA9EC;font-size:16px;background:#26215C;padding:6px 10px;border-radius:8px;margin-bottom:8px">🎰 ${t.bet_content}${t.bet_amount ? ` $${t.bet_amount}` : ''}</div>` : ''}
      <div style="margin-bottom:8px">${memberRows}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">
        <div style="font-size:14px;color:#6b6485">邀請碼：<span style="color:#7F77DD;font-weight:600">${t.invite_code}</span></div>
        <div style="display:flex;gap:8px">
          <button onclick="copyInvite('${t.name}','${t.invite_code}')" style="background:#534AB7;color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:14px;cursor:pointer;transition:transform .15s,opacity .15s" onmousedown="this.style.transform='scale(.93)'" onmouseup="this.style.transform=''">📨 邀請</button>
          <button onclick="leaveTeam('${t.id}','${t.name}')" style="background:transparent;color:#ff6b6b;border:1px solid #ff6b6b;border-radius:8px;padding:6px 14px;font-size:14px;cursor:pointer;transition:transform .15s,background .15s" onmouseover="this.style.background='rgba(255,107,107,.1)'" onmouseout="this.style.background='transparent'" onmousedown="this.style.transform='scale(.93)'" onmouseup="this.style.transform=''">退出</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function showCreateTeam(){
  const form=document.getElementById('create-team-form');
  document.getElementById('join-team-form').style.display='none';
  if(!form.style.display||form.style.display==='none'){
    form.style.display='block';
    const card=form.querySelector('.card');
    card.classList.remove('form-expand');
    requestAnimationFrame(()=>card.classList.add('form-expand'));
  }else{form.style.display='none';}
}
function showJoinTeam(){
  const form=document.getElementById('join-team-form');
  document.getElementById('create-team-form').style.display='none';
  if(!form.style.display||form.style.display==='none'){
    form.style.display='block';
    const card=form.querySelector('.card');
    card.classList.remove('form-expand');
    requestAnimationFrame(()=>card.classList.add('form-expand'));
  }else{form.style.display='none';}
}

async function joinTeam() {
  const code = document.getElementById('invite-code').value.trim().toLowerCase();
  if (!code || code.length !== 8) { showToast('請輸入正確的8碼邀請碼','error'); return; }
  const { data: team } = await db.from('teams').select('*').eq('invite_code', code).single();
  if (!team) { showToast('找不到這個邀請碼，請確認是否正確','error'); return; }
  const { data: existing } = await db.from('team_members').select('id').eq('team_id', team.id).eq('user_id', userId).maybeSingle();
  if (existing) { showToast('你已經在這個隊伍裡了！','warn'); return; }
  await db.from('team_members').insert({ team_id: team.id, user_id: userId });
  showToast(`成功加入「${team.name}」！`);
  document.getElementById('join-team-form').style.display = 'none';
  loadTeams();
}

async function createTeam() {
  const name = document.getElementById('team-name').value;
  const deadline = document.getElementById('team-deadline').value;
  const betContent = document.getElementById('bet-content').value;
  const betAmount = parseInt(document.getElementById('bet-amount').value) || null;
  if (!name) { showToast('請填寫隊伍名稱','error'); return; }
  const { data: team } = await db.from('teams').insert({ name, leader_id: userId, deadline: deadline || null, bet_content: betContent || null, bet_amount: betAmount }).select().single();
  if (team) {
    await db.from('team_members').insert({ team_id: team.id, user_id: userId });
    showToast(`隊伍建立成功！邀請碼：${team.invite_code}`);
    document.getElementById('create-team-form').style.display = 'none';
    loadTeams();
  }
}

async function loadGoals() {
  const { data } = await db.from('team_members').select('goal_weight,goal_body_fat,daily_calorie_limit,calorie_goal').eq('user_id', userId).order('joined_at', { ascending: false }).limit(1).maybeSingle();
  if (data) {
    if (data.goal_weight) document.getElementById('g-weight').value = data.goal_weight;
    if (data.goal_body_fat) document.getElementById('g-fat').value = data.goal_body_fat;
    const cal = data.calorie_goal || data.daily_calorie_limit;
    if (cal) document.getElementById('g-cal').value = cal;
  }
}

async function saveGoals(){
  const gw=parseFloat(document.getElementById('g-weight').value);
  const gf = parseFloat(document.getElementById('g-fat').value);
  const gc = parseInt(document.getElementById('g-cal').value);
  // 先查有沒有既有記錄
  const { data: existing } = await db.from('team_members').select('id').eq('user_id', userId).order('joined_at', { ascending: false }).limit(1).maybeSingle();
  if (existing) {
    await db.from('team_members').update({ goal_weight: gw||null, goal_body_fat: gf||null, daily_calorie_limit: gc||null, calorie_goal: gc||null }).eq('id', existing.id);
  } else {
    await db.from('team_members').insert({ user_id: userId, goal_weight: gw||null, goal_body_fat: gf||null, daily_calorie_limit: gc||null, calorie_goal: gc||null });
  }
  showToast('目標已儲存！');
  loadData();
}

async function quickRecord() {
  const w = parseFloat(document.getElementById('q-weight').value);
  const f = parseFloat(document.getElementById('q-fat').value);
  const wa = parseInt(document.getElementById('q-water').value);
  if (!w && !f && !wa) { showToast('請至少填一項','error'); return; }
  await db.from('body_records').insert({ user_id: userId, weight: w||null, body_fat: f||null, water_ml: wa||null });
  if (w) {
    const { data: existing } = await db.from('achievements').select('id').eq('user_id', userId).eq('badge_type', 'first_record').limit(1);
    if (!existing || existing.length === 0) await db.from('achievements').insert({ user_id: userId, badge_type: 'first_record' });
  }
  document.getElementById('q-weight').value = '';
  document.getElementById('q-fat').value = '';
  document.getElementById('q-water').value = '';
  const rBtn=document.querySelector('#screen-goal .card-badge .btn-purple');
  if(rBtn){rBtn.textContent='✓ 記錄成功';rBtn.classList.add('btn-did-success');setTimeout(()=>{rBtn.textContent='記錄';rBtn.classList.remove('btn-did-success');},1200);}
  showToast('記錄成功！');
  loadData();
}

function switchTab(name){
  const current=document.querySelector('.screen.active');
  const doSwitch=()=>{
    ['data','team','food','goal'].forEach(t=>{
      document.getElementById(`screen-${t}`).classList.toggle('active',t===name);
      document.getElementById(`tab-${t}`).classList.toggle('active',t===name);
    });
    if(current)current.classList.remove('fading');
    const next=document.getElementById(`screen-${name}`);
    if(next){next.style.opacity='0';requestAnimationFrame(()=>{next.style.opacity='';});}
    // tab icon 跳動
    const aTab=document.getElementById(`tab-${name}`);
    [aTab?.querySelector('svg'),aTab?.querySelector('span')].forEach(el=>{
      if(el){el.style.animation='none';requestAnimationFrame(()=>{el.style.animation='';});}
    });
    // 重置卡片動畫
    if(name==='food')document.querySelectorAll('#screen-food .anim-card').forEach(c=>{c.style.animation='none';requestAnimationFrame(()=>{c.style.animation='';});});
    if(name==='goal')document.querySelectorAll('#screen-goal .anim-card').forEach(c=>{c.style.animation='none';requestAnimationFrame(()=>{c.style.animation='';});});
  };
  if(current){current.classList.add('fading');setTimeout(doSwitch,180);}else{doSwitch();}
  const hero=document.querySelector('.hero-banner');
  if(hero)hero.style.display=name==='data'?'block':'none';
  if(name==='food')setTimeout(loadMeals,200);
  if(name==='team')setTimeout(loadTeams,200);
  if(name==='goal')setTimeout(loadGoals,200);
}

init().catch(console.error);
</script>
</div>
